<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Renamed ids and names</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem; color: #1c1917; background: #faf7f2; }
    form { max-width: 40rem; }
    .field { margin: 0 0 1rem; }
    label, .field-label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input[type="text"], select, textarea { width: 100%; max-width: 24rem; padding: 0.4rem 0.5rem; }
    button { margin-top: 0.5rem; }
    h1 { font-size: 1.4rem; }
    .note { color: #57534e; font-size: 0.9rem; }
  </style>
</head>
<body>
  <!-- Ids and names no longer say fname, gender or state. The visible labels are unchanged. The Transgender span still points its for at the Female option. -->
  <h1>Renamed ids and names</h1>
  <p class="note">Ids and names no longer say fname, gender or state. The visible labels are unchanged. The Transgender span still points its for at the Female option.</p>

<form id="practice" class="well" method="post" autocomplete="off" novalidate onsubmit="window.__submitted=true;return false;">
    <div class="field form-group">
        <label for="qx7k" class="control-label">First Name</label>
        <input id="qx7k" type="text" name="alpha-field" class="form-control" placeholder="Name" />
    </div>
    <div class="field form-group">
        <label for="ln-zz" class="control-label">Last Name</label>
        <input id="ln-zz" type="text" name="beta-field" class="form-control" placeholder="Surname" />
    </div>
    <div class="field form-group">
        
                        <label class="control-label">Gender</label>
                        <div class="choices">
                            <input id="opt-m" type="radio" name="choice-set" value="Male" />
                            <span name="opt-m" for="opt-m">Male</span>
                            <input id="opt-f" type="radio" name="choice-set" value="Female" />
                            <span name="opt-f" for="opt-f">Female</span>
                            <input id="opt-t" type="radio" name="choice-set" value="Transgender" />
                            <span name="opt-t" for="opt-f">Transgender</span>
                        </div>

    </div>
    <div class="field form-group">
        <label for="country-box" class="control-label"> Country </label>
        <input id="country-box" type="text" name="place-free-text" class="form-control" placeholder="Country" />
    </div>
    <div class="field form-group">
        
                        <label for="dd-region" name="region-list">  State  </label>
                        <select class="form-control" id="dd-region" name="region-list">

                            <option> -- Select Country -- </option>
                            <option value="Afganistan"> Afganistan </option>
                            <option value="Argentina">Argentina</option>
                            <option value="India">India</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="United States">United States</option>
                            <option value="Zimbabwe">Zimbabwe</option>

                        </select>

    </div>
      <button type="submit">Submit</button>
</form>

</body>
</html>
